<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Lance</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>

<div th:replace="~{fragments/layout :: customheader}">
        </div>   
        
        <h1>Form do Lance</h1>
        <h4>Informações do Lance</h4>

        
         <form
            class="d-grid gap-3" th:action="@{/logar}" th:object="${credentciais}" method="post">
           
            <div class="grupo">
                <label>Valor</label>
                <input type="number" th:field="number" required />
            </div>
            
            <div class="grupo">
                <label>Data do lance:</label>
                <input type="Date" th:field="{date}" required />
            </div>
               <div class="grupo">
                <label>Identificação do Edital:</label>
                <input type="Date" th:field="{date}" required />
            
               </div>
               <div class="grupo">
                <label>Identificação do Usuário:</label>
                <input type="Date" th:field="{date}" required />
            </div>
             
             
            
            <button type="submit" class="botaoenviar">Executar Lance</button>
        
            
         
         </form>
        
    </body>
</html>
