<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Painel de Editais</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    
    <style>
:root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --border: #e2e8f0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
}

/* Painel Centralizado */
.container-center {
    background: var(--card-bg);
    padding: 3rem 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 480px;
    text-align: center;
    border: 1px solid var(--border);
}

.page-title {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--primary);
    margin-bottom: 0.75rem;
}

h1 {
    font-size: 1.65rem;
    color: var(--text-main);
    margin-bottom: 2.5rem;
    line-height: 1.3;
}

/* Alinhamento dos dois botões lado a Lado */
.button-group {
    display: flex;
    gap: 1rem;
}

/* Estilo dos Botões */
.btn {
    display: block;
    flex: 1;
    padding: 0.8rem 1.25rem;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: all 0.2s;
}

.btn-primary {
    background-color: var(--primary);
    color: white;
}

.btn-primary:hover {
    background-color: var(--primary-hover);
}

.btn-outline {
    background-color: transparent;
    border: 2px solid var(--primary);
    color: var(--primary);
}

.btn-outline:hover {
    background-color: rgba(79, 70, 229, 0.05);
}</style>
<div class="container-center">
        <span class="page-title">Início</span>
        
        <h1>Bem-vindo ao Portal de Editais</h1>
        
        <div class="button-group">
            <a href="/login" class="btn btn-primary">Logar</a>
            <a href="/registrar" class="btn btn-outline">Registrar</a>
        </div>
    </div>

</body>
</html>
