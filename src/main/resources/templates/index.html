<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Painel de Editais</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background-color: #fff5f5; /* Fundo avermelhado bem sutil e limpo */
    color: #2d1a1a;            /* Texto escuro com um leve toque quente */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    position: relative;        /* Permite fixar o botão voltar no topo da tela */
}

/* Botão Voltar (Fixo no canto superior esquerdo) */
.botaovoltar {
    position: absolute;
    top: 24px;
    left: 24px;
    color: #a15b5b;            /* Vermelho fosco sutil */
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
}

.botaovoltar:hover {
    color: #7f1d1d;            /* Vermelho escuro ao passar o mouse */
}

/* Caixa branca centralizada */
.card {
    background-color: #ffffff;
    padding: 40px 32px;
    border-radius: 8px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    border: 1px solid #ebd3d3; /* Borda avermelhada bem fininha */
}

.titulo {
    font-size: 24px;
    color: #991b1b;            /* Vermelho elegante para os títulos */
    margin-bottom: 32px;
}

/* Espaçamento dos campos de texto */
.grupo {
    text-align: left;
    margin-bottom: 20px;
}

.grupo label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    font-size: 14px;
    color: #4a2828;
}

.grupo input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ebd3d3;
    border-radius: 4px;
    font-size: 15px;
    outline: none;
}

.grupo input:focus {
    border-color: #991b1b;    /* Borda fica vermelha ao clicar no campo */
}

/* Botão de enviar dos formulários */
.botaoenviar {
    display: block;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    background-color: #991b1b; /* Vermelho principal */
    color: white;
    margin-top: 24px;
}

.botaoenviar:hover {
    background-color: #7f1d1d; /* Vermelho mais escuro no hover */
}

/* Ajustes exclusivos da Página Inicial (Dois botões lado a lado) */
.grupobotoes {
    display: flex;
    gap: 16px;                 /* Espaço entre um botão e outro */
}

.botaoprincipal {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    background-color: #991b1b;
    color: white;
    text-decoration: none;
    text-align: center;
}

.botaoprincipal:hover {
    background-color: #7f1d1d;
}

.botaoborda {
    flex: 1;
    padding: 12px;
    border: 2px solid #991b1b;
    border-radius: 4px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    background-color: transparent;
    color: #991b1b;
    text-decoration: none;
    text-align: center;
}

.botaoborda:hover {
    background-color: #fff5f5; /* Fundo avermelhado sutil ao passar o mouse */
}
    </style>


    <div class="card">
        <h1 class="titulo">Bem-vindo ao Portal de Editais</h1>
        
        <div class="grupobotoes">
            <a href="/login" class="botaoprincipal">Logar</a>
            <a href="/registrar" class="botaoborda">Registrar</a>
        </div>
    </div>

</body>
</html>
