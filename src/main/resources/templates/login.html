<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
<h2>Acessar o Sistema</h2>
    
    <div th:if="${param.error}" style="color: red;">
        E-mail ou Senha incorretos.
    </div>
    <div th:if="${param.success}" style="color: green;">
        Cadastro realizado com sucesso! Faça seu login.
    </div>

    <form th:action="@{/login}" th:object="${userRequest}" method="POST">
        <label>Email:</label>
        <input type="email" th:field="*{email}" required /><br/><br/>

        <label>Senha:</label>
        <input type="password" th:field="*{senha}" required /><br/><br/>

        <button type="submit">Entrar</button>
    </form>
    <br/>
    <a th:href="@{/register}">Não tem conta? Cadastre-se aqui</a>
    </body>
</html>
