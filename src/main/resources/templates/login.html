<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <style>:root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --border: #e2e8f0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
}

/* Painel Centralizado */
.container-center {
    background: var(--card-bg);
    padding: 3rem 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 450px;
    text-align: center;
    border: 1px solid var(--border);
}

.page-title {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--primary);
    margin-bottom: 0.75rem;
}

h1 {
    font-size: 1.65rem;
    color: var(--text-main);
    margin-bottom: 2rem;
    line-height: 1.3;
}

/* Formulários Simplificados */
.form-group {
    text-align: left;
    margin-bottom: 1.25rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.4rem;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-main);
}

.form-group input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background-color: #fff;
    color: var(--text-main);
    outline: none;
    font-size: 0.95rem;
}

.form-group input:focus {
    border-color: var(--primary);
}

/* Alinhamento dos dois botões lado a lado */
.button-group {
    display: flex;
    gap: 1rem;
    margin-top: 1.5rem;
}

/* Estilo dos Botões */
.btn {
    display: block;
    flex: 1;
    padding: 0.8rem 1.25rem;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: all 0.2s;
}

.btn-primary {
    background-color: var(--primary);
    color: white;
}

.btn-primary:hover {
    background-color: var(--primary-hover);
}

.btn-outline {
    background-color: transparent;
    border: 2px solid var(--primary);
    color: var(--primary);
}

.btn-outline:hover {
    background-color: rgba(79, 70, 229, 0.05);
}</style>
    <div class="container-center">
        <span class="page-title">Acesso</span>
        <h1>Fazer Login</h1>
        
        <form th:action="@{/logar}" th:object="${credenciais}" method="post">
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" th:field="*{email}" required />
            </div>
            
            <div class="form-group">
                <label>Senha:</label>
                <input type="password" th:field="*{senha}" required />
            </div>
            
            <div class="button-group">
                <a href="/" class="btn btn-outline">Voltar</a>
                <button type="submit" class="btn btn-primary">Logar</button>
            </div>
        </form>
    </div>

</body>
</html>
